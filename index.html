<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆图纸生成器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

  :root {
    --bg: #f0f4ff;
    --card: #ffffff;
    --accent: #5b7fff;
    --accent2: #ff6b9d;
    --text: #1a1a2e;
    --sub: #666;
    --border: #e0e7ff;
    --grid-line: rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(91,127,255,0.07);
  }

  .logo {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  header h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  header span { color: var(--accent); }

  .main { display: flex; gap: 24px; padding: 28px 32px; max-width: 1300px; margin: 0 auto; }

  .panel {
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    border: 1.5px solid var(--border);
    box-shadow: 0 4px 20px rgba(91,127,255,0.06);
  }

  .left { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }

  .upload-zone {
    border: 2.5px dashed var(--accent);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #f5f8ff;
    position: relative;
  }
  .upload-zone:hover { background: #eef2ff; border-color: var(--accent2); }
  .upload-zone.dragover { background: #e8edff; transform: scale(1.02); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 36px; margin-bottom: 10px; }
  .upload-zone p { font-size: 14px; color: var(--sub); line-height: 1.6; }
  .upload-zone strong { color: var(--accent); font-weight: 800; }

  .section-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 10px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .control-row label { font-size: 13px; font-weight: 700; }
  .control-row span { font-size: 13px; color: var(--accent); font-weight: 800; }

  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    margin-top: 4px;
  }

  .palette-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  .palette-dot {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
  }
  .palette-dot:hover { transform: scale(1.3); z-index: 10; }
  .palette-dot.disabled { opacity: 0.2; }
  .palette-dot.active::after {
    content: '✓';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: white;
    text-shadow: 0 0 3px rgba(0,0,0,0.8);
  }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #7c9fff);
    color: white;
    box-shadow: 0 4px 15px rgba(91,127,255,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91,127,255,0.45); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: #f0f4ff;
    color: var(--accent);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover { background: #e8edff; }

  .right { flex: 1; }

  .canvas-area {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 500px;
    position: relative;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 500px;
    color: #bbb;
    font-size: 15px;
    gap: 12px;
  }
  .placeholder-icon { font-size: 64px; opacity: 0.4; }

  #outputCanvas {
    display: none;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    image-rendering: pixelated;
    max-width: 100%;
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1.5px solid var(--border);
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat .val { font-size: 22px; font-weight: 900; color: var(--accent); }
  .stat .lbl { font-size: 11px; color: var(--sub); font-weight: 700; }

  .color-legend {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f8f9ff;
    padding: 4px 10px 4px 6px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
  }
  .legend-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.1);
    flex-shrink: 0;
  }

  .preview-img {
    max-width: 100%;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    display: none;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: white;
    color: var(--sub);
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  #hiddenCanvas { display: none; }

  @media (max-width: 800px) {
    .main { flex-direction: column; padding: 16px; }
    .left { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🫘</div>
  <h1>拼<span>豆</span>图纸生成器</h1>
</header>

<div class="main">
  <!-- 左侧控制面板 -->
  <div class="left">
    <div class="panel">
      <div class="section-title">上传图片</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*">
        <div class="upload-icon">☁️</div>
        <p><strong>点击上传</strong> 或拖放图片<br>支持 JPG、PNG · 最大 10MB</p>
      </div>
      <img id="previewImg" class="preview-img" style="margin-top:12px;">
    </div>

    <div class="panel">
      <div class="section-title">图纸设置</div>

      <div class="control-row">
        <label>网格大小（列数）</label>
        <span id="colsVal">48</span>
      </div>
      <input type="range" id="colsSlider" min="16" max="96" value="48" step="4">

      <div class="control-row" style="margin-top:12px;">
        <label>显示网格线</label>
        <input type="checkbox" id="showGrid" checked style="width:16px;height:16px;accent-color:var(--accent);">
      </div>

      <div class="control-row">
        <label>显示色号</label>
        <input type="checkbox" id="showNumbers" style="width:16px;height:16px;accent-color:var(--accent);">
      </div>
    </div>

    <div class="panel">
      <div class="section-title">色板选择</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:10px;">点击切换启用/禁用颜色</div>
      <div class="palette-grid" id="paletteGrid"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-secondary" style="font-size:12px;padding:8px;" onclick="selectAll()">全选</button>
        <button class="btn btn-secondary" style="font-size:12px;padding:8px;" onclick="selectNone()">全不选</button>
      </div>
    </div>

    <button class="btn btn-primary" id="generateBtn" disabled onclick="generate()">🎨 生成图纸</button>
    <button class="btn btn-secondary" id="downloadBtn" style="display:none;" onclick="download()">⬇️ 下载图纸</button>
  </div>

  <!-- 右侧预览 -->
  <div class="right">
    <div class="panel">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('pattern')">图纸预览</div>
        <div class="tab" onclick="switchTab('legend')">颜色清单</div>
      </div>

      <div id="tabPattern">
        <div class="canvas-area">
          <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">🫘</div>
            <div>上传图片后点击「生成图纸」</div>
          </div>
          <canvas id="outputCanvas"></canvas>
        </div>
        <div class="stats-bar" id="statsBar" style="display:none;">
          <div class="stat"><div class="val" id="statCols">-</div><div class="lbl">列</div></div>
          <div class="stat"><div class="val" id="statRows">-</div><div class="lbl">行</div></div>
          <div class="stat"><div class="val" id="statTotal">-</div><div class="lbl">总颗数</div></div>
          <div class="stat"><div class="val" id="statColors">-</div><div class="lbl">颜色种数</div></div>
        </div>
      </div>

      <div id="tabLegend" style="display:none;">
        <div style="font-size:13px;color:var(--sub);margin-bottom:12px;">生成图纸后显示所需颜色及数量</div>
        <div class="color-legend" id="colorLegend"></div>
      </div>
    </div>
  </div>
</div>

<canvas id="hiddenCanvas"></canvas>

<script>
// ===== 拼豆色板 (Perler / Hama 常用色) =====
const PALETTE = [
  { name: '白色',   hex: '#FFFFFF' },
  { name: '奶油',   hex: '#FFFDD0' },
  { name: '浅黄',   hex: '#FFE680' },
  { name: '黄色',   hex: '#FFD700' },
  { name: '橙黄',   hex: '#FFA500' },
  { name: '橙色',   hex: '#FF6600' },
  { name: '深橙',   hex: '#FF4500' },
  { name: '红色',   hex: '#E8272A' },
  { name: '深红',   hex: '#9B1C1C' },
  { name: '玫红',   hex: '#E91E63' },
  { name: '粉红',   hex: '#FF87BE' },
  { name: '浅粉',   hex: '#FFB6C1' },
  { name: '紫红',   hex: '#C71585' },
  { name: '紫色',   hex: '#9B59B6' },
  { name: '深紫',   hex: '#5B2C6F' },
  { name: '蓝紫',   hex: '#6C3483' },
  { name: '宝蓝',   hex: '#2E4CD1' },
  { name: '蓝色',   hex: '#1E90FF' },
  { name: '天蓝',   hex: '#5DADE2' },
  { name: '浅蓝',   hex: '#AED6F1' },
  { name: '冰蓝',   hex: '#D6EAF8' },
  { name: '青色',   hex: '#00BCD4' },
  { name: '深青',   hex: '#008B8B' },
  { name: '薄荷',   hex: '#98FFB3' },
  { name: '浅绿',   hex: '#90EE90' },
  { name: '草绿',   hex: '#4CAF50' },
  { name: '绿色',   hex: '#27AE60' },
  { name: '深绿',   hex: '#1B5E20' },
  { name: '橄榄',   hex: '#6B8E23' },
  { name: '卡其',   hex: '#C3A843' },
  { name: '棕色',   hex: '#8B5E3C' },
  { name: '深棕',   hex: '#5D3317' },
  { name: '咖啡',   hex: '#3E2723' },
  { name: '浅灰',   hex: '#D5D5D5' },
  { name: '灰色',   hex: '#9E9E9E' },
  { name: '深灰',   hex: '#555555' },
  { name: '黑色',   hex: '#1A1A1A' },
  { name: '金色',   hex: '#DAA520' },
  { name: '银色',   hex: '#C0C0C0' },
  { name: '肤色',   hex: '#FDBCB4' },
];

let enabledColors = new Set(PALETTE.map((_, i) => i));
let uploadedImage = null;
let lastPattern = null;

// ===== 初始化色板UI =====
function initPalette() {
  const grid = document.getElementById('paletteGrid');
  PALETTE.forEach((c, i) => {
    const dot = document.createElement('div');
    dot.className = 'palette-dot active';
    dot.style.background = c.hex;
    dot.title = c.name;
    dot.onclick = () => toggleColor(i, dot);
    grid.appendChild(dot);
  });
}

function toggleColor(i, el) {
  if (enabledColors.has(i)) {
    enabledColors.delete(i);
    el.classList.remove('active');
    el.classList.add('disabled');
  } else {
    enabledColors.add(i);
    el.classList.add('active');
    el.classList.remove('disabled');
  }
}

function selectAll() {
  PALETTE.forEach((_, i) => enabledColors.add(i));
  document.querySelectorAll('.palette-dot').forEach(d => {
    d.classList.add('active'); d.classList.remove('disabled');
  });
}

function selectNone() {
  enabledColors.clear();
  document.querySelectorAll('.palette-dot').forEach(d => {
    d.classList.remove('active'); d.classList.add('disabled');
  });
}

// ===== 文件上传 =====
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadImage(e.target.files[0]);
});

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      uploadedImage = img;
      const preview = document.getElementById('previewImg');
      preview.src = ev.target.result;
      preview.style.display = 'block';
      document.getElementById('generateBtn').disabled = false;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== 滑块 =====
const colsSlider = document.getElementById('colsSlider');
colsSlider.addEventListener('input', () => {
  document.getElementById('colsVal').textContent = colsSlider.value;
});

// ===== 颜色匹配 (Lab色彩空间，感知更准) =====
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r, g, b];
}

function rgbToLab(r, g, b) {
  let R = r/255, G = g/255, B = b/255;
  R = R > 0.04045 ? Math.pow((R+0.055)/1.055, 2.4) : R/12.92;
  G = G > 0.04045 ? Math.pow((G+0.055)/1.055, 2.4) : G/12.92;
  B = B > 0.04045 ? Math.pow((B+0.055)/1.055, 2.4) : B/12.92;
  let X = (R*0.4124 + G*0.3576 + B*0.1805) / 0.95047;
  let Y = (R*0.2126 + G*0.7152 + B*0.0722) / 1.00000;
  let Z = (R*0.0193 + G*0.1192 + B*0.9505) / 1.08883;
  const f = v => v > 0.008856 ? Math.cbrt(v) : 7.787*v + 16/116;
  return [116*f(Y)-16, 500*(f(X)-f(Y)), 200*(f(Y)-f(Z))];
}

function colorDist(lab1, lab2) {
  return Math.sqrt((lab1[0]-lab2[0])**2 + (lab1[1]-lab2[1])**2 + (lab1[2]-lab2[2])**2);
}

// 预计算色板Lab值
const paletteLab = PALETTE.map(c => {
  const [r,g,b] = hexToRgb(c.hex);
  return rgbToLab(r,g,b);
});

function nearestColor(r, g, b) {
  const lab = rgbToLab(r, g, b);
  let best = -1, bestDist = Infinity;
  enabledColors.forEach(i => {
    const d = colorDist(lab, paletteLab[i]);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

// ===== 核心生成逻辑 =====
function generate() {
  if (!uploadedImage || enabledColors.size === 0) return;

  const cols = parseInt(colsSlider.value);
  const aspect = uploadedImage.height / uploadedImage.width;
  const rows = Math.round(cols * aspect);
  const CELL = Math.max(8, Math.floor(600 / cols)); // 每格像素大小

  // 1. 缩放图片到 cols×rows
  const hidden = document.getElementById('hiddenCanvas');
  hidden.width = cols;
  hidden.height = rows;
  const hctx = hidden.getContext('2d');
  hctx.drawImage(uploadedImage, 0, 0, cols, rows);
  const imgData = hctx.getImageData(0, 0, cols, rows).data;

  // 2. 每格颜色匹配
  const pattern = []; // pattern[r][c] = palette index
  const colorCount = {};

  for (let r = 0; r < rows; r++) {
    pattern[r] = [];
    for (let c = 0; c < cols; c++) {
      const idx = (r * cols + c) * 4;
      const pr = imgData[idx], pg = imgData[idx+1], pb = imgData[idx+2], pa = imgData[idx+3];
      let ci;
      if (pa < 64) {
        ci = -1; // 透明 → 空格
      } else {
        ci = nearestColor(pr, pg, pb);
      }
      pattern[r][c] = ci;
      if (ci >= 0) {
        colorCount[ci] = (colorCount[ci] || 0) + 1;
      }
    }
  }

  lastPattern = { pattern, rows, cols, colorCount, CELL };

  // 3. 渲染
  renderCanvas(pattern, rows, cols, colorCount, CELL);
}

function renderCanvas(pattern, rows, cols, colorCount, CELL) {
  const showGrid = document.getElementById('showGrid').checked;
  const showNumbers = document.getElementById('showNumbers').checked;

  const canvas = document.getElementById('outputCanvas');
  canvas.width = cols * CELL;
  canvas.height = rows * CELL;
  const ctx = canvas.getContext('2d');

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ci = pattern[r][c];
      if (ci < 0) {
        ctx.fillStyle = '#f5f5f5';
      } else {
        ctx.fillStyle = PALETTE[ci].hex;
      }
      ctx.fillRect(c*CELL, r*CELL, CELL, CELL);

      // 画圆形（模拟珠子）
      if (ci >= 0 && CELL >= 10) {
        ctx.beginPath();
        ctx.arc(c*CELL + CELL/2, r*CELL + CELL/2, CELL/2 - 1.5, 0, Math.PI*2);
        ctx.fillStyle = PALETTE[ci].hex;
        ctx.fill();

        // 高光
        ctx.beginPath();
        ctx.arc(c*CELL + CELL*0.35, r*CELL + CELL*0.35, CELL*0.18, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fill();
      }

      // 色号
      if (showNumbers && ci >= 0 && CELL >= 16) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.font = `bold ${Math.max(6, CELL*0.3)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ci+1, c*CELL + CELL/2, r*CELL + CELL/2);
      }
    }
  }

  // 网格线
  if (showGrid) {
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 0.5;
    for (let c = 0; c <= cols; c++) {
      ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, rows*CELL); ctx.stroke();
    }
    for (let r = 0; r <= rows; r++) {
      ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(cols*CELL, r*CELL); ctx.stroke();
    }
    // 每10格加粗线
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= cols; c+=10) {
      ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, rows*CELL); ctx.stroke();
    }
    for (let r = 0; r <= rows; r+=10) {
      ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(cols*CELL, r*CELL); ctx.stroke();
    }
  }

  // 显示
  document.getElementById('placeholder').style.display = 'none';
  canvas.style.display = 'block';
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('downloadBtn').style.display = 'block';

  const usedColors = Object.keys(colorCount).length;
  document.getElementById('statCols').textContent = cols;
  document.getElementById('statRows').textContent = rows;
  document.getElementById('statTotal').textContent = (rows*cols - (colorCount[-1]||0)).toLocaleString();
  document.getElementById('statColors').textContent = usedColors;

  // 颜色清单
  const legend = document.getElementById('colorLegend');
  legend.innerHTML = '';
  const sorted = Object.entries(colorCount).sort((a,b) => b[1]-a[1]);
  sorted.forEach(([ci, cnt]) => {
    const c = PALETTE[ci];
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${c.hex}"></div>${c.name} <span style="color:var(--sub)">×${cnt}</span>`;
    legend.appendChild(item);
  });
}

// ===== 重新渲染（切换网格/色号时） =====
document.getElementById('showGrid').addEventListener('change', rerender);
document.getElementById('showNumbers').addEventListener('change', rerender);
function rerender() {
  if (lastPattern) {
    const { pattern, rows, cols, colorCount, CELL } = lastPattern;
    renderCanvas(pattern, rows, cols, colorCount, CELL);
  }
}

// ===== Tab切换 =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0&&tab==='pattern')||(i===1&&tab==='legend'));
  });
  document.getElementById('tabPattern').style.display = tab==='pattern' ? '' : 'none';
  document.getElementById('tabLegend').style.display = tab==='legend' ? '' : 'none';
}

// ===== 下载 =====
function download() {
  const canvas = document.getElementById('outputCanvas');
  const a = document.createElement('a');
  a.download = '拼豆图纸.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

initPalette();
</script>
</body>
</html>

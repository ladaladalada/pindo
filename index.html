<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe 测音准与声控中心 Ultimate</title>
    <style>
        /* ================= 基础样式 ================= */
        :root {
            --bg-color: #1a1a2e;
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #F9D423;
            --dark: #16213e;
            --white: #ffffff;
            --panel-bg: #0f3460;
            --border: 3px solid #e94560;
        }

        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Varela Round', 'PingFang SC', sans-serif; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--white);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        header { width: 100%; max-width: 800px; padding: 20px; text-align: center; }
        h1 { margin: 0 0 15px 0; font-size: 28px; text-shadow: 2px 2px 0px var(--primary); }
        
        .tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--panel-bg); color: var(--white); border: 2px solid var(--secondary); border-radius: 12px;
            padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0px var(--secondary); transition: all 0.1s;
        }
        .tab-btn.active {
            background: var(--secondary); color: var(--bg-color);
            transform: translate(0, 4px); box-shadow: 0 0px 0px var(--secondary);
        }

        .mic-control {
            margin-top: 15px; padding: 10px 20px; background: var(--primary); color: white;
            border: none; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .module {
            display: none; width: 100%; max-width: 800px; background: var(--dark);
            border: var(--border); border-radius: 20px; padding: 20px; margin-top: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); flex-direction: column; align-items: center;
            position: relative;
        }
        .module.active { display: flex; }

        /* ======== 模块 Canvas 容器 ======== */
        canvas {
            width: 100%; max-width: 760px; background: var(--bg-color); 
            border-radius: 15px; display: block; border: 2px solid #2a2a4a;
        }
        
        .ui-header { text-align: center; margin-bottom: 10px; width: 100%; display: flex; justify-content: space-between; align-items: center;}
        .ui-title { font-size: 20px; font-weight: bold; color: var(--secondary); }
        .ui-score { font-size: 24px; font-weight: bold; color: var(--accent); }
        
        .controls { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; justify-content: flex-start;}
        select { padding: 8px; border-radius: 8px; background: var(--panel-bg); color: white; border: 1px solid var(--secondary); font-size: 16px; outline: none; }

        /* 游戏结束的浮层恢复 */
        .game-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(22, 33, 62, 0.95); border: 2px solid var(--primary); padding: 30px;
            border-radius: 15px; text-align: center; display: none; box-shadow: 0 0 30px rgba(255,107,107,0.3);
        }

        @media (max-width: 600px) {
            .module { padding: 10px; border-width: 2px; }
            canvas { height: 250px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎤 Vibe 音游中心</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tuner', this)">K歌音准仪</button>
            <button class="tab-btn" onclick="switchTab('song', this)">节奏音准挑战</button>
            <button class="tab-btn" onclick="switchTab('game', this)">声控跑酷</button>
        </div>
        <button class="mic-control" id="btnMic" onclick="initAudio()">点击开启麦克风 🎙️</button>
    </header>

    <!-- 模块 1：K歌音准仪 -->
    <div id="tuner" class="module active">
        <div class="ui-header">
            <div class="ui-title" id="hzDisplay">发出声音开始画线...</div>
            <div class="ui-score" id="noteDisplay" style="color:var(--primary)">--</div>
        </div>
        <canvas id="tunerCanvas" width="760" height="350"></canvas>
    </div>

    <!-- 模块 2：老歌测音准 -->
    <div id="song" class="module">
        <div class="controls">
            <select id="songSelect">
                <option value="star">🌟 小星星</option>
                <option value="birthday">🎂 生日快乐歌</option>
                <option value="joy">🕊️ 欢乐颂</option>
            </select>
            <button class="tab-btn" style="background:var(--accent); color:var(--bg-color);" onclick="startSong()">▶️ 开始挑战</button>
        </div>
        <div class="ui-header">
            <div class="ui-title">用声音撞击方块！</div>
            <div class="ui-score">得分: <span id="songScoreDisplay">0</span></div>
        </div>
        <canvas id="songCanvas" width="760" height="350"></canvas>
    </div>

    <!-- 模块 3：声控游戏 (恢复了完整的 UI 和流程) -->
    <div id="game" class="module">
        <div class="controls">
            <button class="tab-btn" style="background:var(--accent); color:var(--bg-color);" onclick="startGame()">▶️ 开始飞行</button>
        </div>
        <div class="ui-header">
            <div class="ui-title">发高音升，低音降，安静悬停</div>
            <div class="ui-score">得分: <span id="gameScoreDisplay">0</span></div>
        </div>
        <canvas id="gameCanvas" width="760" height="300"></canvas>
        
        <div class="game-overlay" id="gameOverScreen">
            <h2 style="color:var(--primary); margin-top:0;">游戏结束!</h2>
            <p style="font-size: 20px;">最终得分: <span id="finalScore" style="color:var(--accent); font-weight:bold;">0</span></p>
            <button class="tab-btn" style="background:var(--secondary); color:var(--bg-color); margin-top:10px;" onclick="startGame()">🔄 再来一局</button>
        </div>
    </div>

    <script>
        // ================= 全局音频与算法 =================
        let audioContext, analyser, microphone;
        let isMicActive = false;
        let animationId = null; 

        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length; let rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.035) return -1; // 噪音门

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2); SIZE = buf.length;
            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++) c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }

            let T0 = maxpos;
            if (c[T0] < 0.1) return -1; // 清晰度校验

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2; let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);
            return sampleRate / T0; 
        }

        function noteFromPitch(frequency) { return 12 * (Math.log(frequency / 440) / Math.log(2)) + 69; }
        function centsOffFromPitch(frequency, note) { return Math.floor(1200 * Math.log(frequency / (440 * Math.pow(2, (Math.round(note) - 69) / 12))) / Math.log(2)); }
        function getNoteName(noteNumber) { return noteStrings[Math.round(noteNumber) % 12] + (Math.floor(Math.round(noteNumber) / 12) - 1); }

        async function initAudio() {
            if (isMicActive) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioContext.createAnalyser(); analyser.fftSize = 2048;
                microphone = audioContext.createMediaStreamSource(stream); microphone.connect(analyser);
                
                isMicActive = true;
                const btn = document.getElementById('btnMic');
                btn.innerText = "🎤 麦克风运作中"; btn.style.background = "var(--secondary)"; btn.style.color = "var(--bg-color)";
                startCurrentModule();
            } catch (err) { alert("获取麦克风失败！请允许权限。"); }
        }

        let currentTab = 'tuner';
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            if (animationId) cancelAnimationFrame(animationId);
            currentTab = tabId; if (isMicActive) startCurrentModule();
        }

        function startCurrentModule() {
            if (!isMicActive) return;
            if (currentTab === 'tuner') loopTuner();
            else if (currentTab === 'song') drawSongInit();
            else if (currentTab === 'game') drawGameInit();
        }

        const buf = new Float32Array(2048);

        // ================= 模块 1：K歌瀑布流 =================
        const tCanvas = document.getElementById('tunerCanvas');
        const tCtx = tCanvas.getContext('2d');
        const MIN_NOTE = 43, MAX_NOTE = 79, NOTE_RANGE = MAX_NOTE - MIN_NOTE;
        let pitchHistory = new Array(120).fill(null); 

        function loopTuner() {
            if (currentTab !== 'tuner') return;
            analyser.getFloatTimeDomainData(buf);
            let pitch = autoCorrelate(buf, audioContext.sampleRate);
            
            let targetY = null;
            if (pitch !== -1 && pitch > 60 && pitch < 1200) { 
                let exactNote = noteFromPitch(pitch);
                let roundedNote = Math.round(exactNote);
                let cents = centsOffFromPitch(pitch, exactNote);
                
                document.getElementById('noteDisplay').innerText = `${getNoteName(roundedNote)} ${cents >= 0 ? '+' : ''}${cents}`;
                document.getElementById('noteDisplay').style.color = Math.abs(cents) < 15 ? "var(--secondary)" : "var(--primary)";
                document.getElementById('hzDisplay').innerText = `${Math.round(pitch)} Hz`;

                targetY = tCanvas.height - ((exactNote - MIN_NOTE) / NOTE_RANGE) * tCanvas.height;
            } else {
                document.getElementById('noteDisplay').innerText = "🔇";
                document.getElementById('hzDisplay').innerText = "安静...";
            }

            pitchHistory.push(targetY); pitchHistory.shift(); 
            tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
            tCtx.textAlign = "right"; tCtx.textBaseline = "middle"; tCtx.font = "14px sans-serif";
            
            for (let n = MIN_NOTE; n <= MAX_NOTE; n++) {
                let noteName = noteStrings[n % 12];
                let y = tCanvas.height - ((n - MIN_NOTE) / NOTE_RANGE) * tCanvas.height;
                if (!noteName.includes('#')) {
                    tCtx.beginPath(); tCtx.moveTo(0, y); tCtx.lineTo(tCanvas.width - 50, y); 
                    tCtx.strokeStyle = noteName === "C" ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.05)";
                    tCtx.stroke();
                    tCtx.fillStyle = noteName === "C" ? "var(--secondary)" : "#666";
                    tCtx.fillText(getNoteName(n), tCanvas.width - 10, y);
                }
            }

            tCtx.beginPath(); tCtx.lineWidth = 4; tCtx.strokeStyle = "var(--primary)";
            let stepX = (tCanvas.width - 60) / pitchHistory.length, isDrawing = false;
            for (let i = 0; i < pitchHistory.length; i++) {
                let py = pitchHistory[i], px = i * stepX;
                if (py !== null) {
                    if (!isDrawing) { tCtx.moveTo(px, py); isDrawing = true; } else { tCtx.lineTo(px, py); }
                    tCtx.fillStyle = "rgba(255, 107, 107, 0.8)";
                    tCtx.beginPath(); tCtx.arc(px, py, 2, 0, Math.PI*2); tCtx.fill();
                    tCtx.beginPath(); tCtx.moveTo(px, py); 
                } else isDrawing = false; 
            }
            tCtx.stroke();
            animationId = requestAnimationFrame(loopTuner);
        }

        // ================= 模块 2：老歌测音准 =================
        const sCanvas = document.getElementById('songCanvas');
        const sCtx = sCanvas.getContext('2d');
        const rawSongs = {
            star: [
                {w:"一",n:60,l:80,g:20}, {w:"闪",n:60,l:80,g:20}, {w:"一",n:67,l:80,g:20}, {w:"闪",n:67,l:80,g:20},
                {w:"亮",n:69,l:80,g:20}, {w:"晶",n:69,l:80,g:20}, {w:"晶",n:67,l:150,g:60},
                {w:"满",n:65,l:80,g:20}, {w:"天",n:65,l:80,g:20}, {w:"都",n:64,l:80,g:20}, {w:"是",n:64,l:80,g:20},
                {w:"小",n:62,l:80,g:20}, {w:"星",n:62,l:80,g:20}, {w:"星",n:60,l:150,g:0}
            ],
            birthday: [
                {w:"祝",n:67,l:60,g:10}, {w:"你",n:67,l:40,g:20}, {w:"生",n:69,l:80,g:20}, {w:"日",n:67,l:80,g:20},
                {w:"快",n:72,l:80,g:20}, {w:"乐",n:71,l:150,g:50}
            ],
            joy: [
                {w:"欢",n:64,l:60,g:10}, {w:"乐",n:64,l:60,g:10}, {w:"女",n:65,l:60,g:10}, {w:"神",n:67,l:60,g:10},
                {w:"圣",n:67,l:60,g:10}, {w:"洁",n:65,l:60,g:10}, {w:"美",n:64,l:60,g:10}, {w:"丽",n:62,l:60,g:10}
            ]
        };

        let parsedSong = [], songOffset = 0, songScore = 0, isSongPlaying = false;
        const PLAYHEAD_X = 150; 
        const SONG_MIN_NOTE = 55; const SONG_MAX_NOTE = 76; const SONG_NOTE_RANGE = SONG_MAX_NOTE - SONG_MIN_NOTE;

        function getSongY(noteFloat) { return sCanvas.height - ((noteFloat - SONG_MIN_NOTE) / SONG_NOTE_RANGE) * sCanvas.height; }

        function drawSongInit() {
            sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
            sCtx.fillStyle = "rgba(255,255,255,0.1)"; sCtx.font = "20px sans-serif"; sCtx.textAlign="center";
            sCtx.fillText("选择上方歌曲，点击开始挑战", sCanvas.width/2, sCanvas.height/2);
        }

        function startSong() {
            if(!isMicActive) { alert("请开启麦克风！"); return; }
            let rawData = rawSongs[document.getElementById('songSelect').value];
            parsedSong = []; let currentX = PLAYHEAD_X + 200; 
            for(let i=0; i<rawData.length; i++) {
                parsedSong.push({ word: rawData[i].w, note: rawData[i].n, startX: currentX, endX: currentX + rawData[i].l, hitCount: 0 });
                currentX += rawData[i].l + rawData[i].g;
            }
            songOffset = 0; songScore = 0; isSongPlaying = true;
            document.getElementById('songScoreDisplay').innerText = "0";
            if(animationId) cancelAnimationFrame(animationId);
            loopSong();
        }

        function loopSong() {
            if (currentTab !== 'song' || !isSongPlaying) return;
            sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);

            sCtx.strokeStyle = "rgba(255,255,255,0.05)"; sCtx.lineWidth = 1;
            for(let n = SONG_MIN_NOTE; n <= SONG_MAX_NOTE; n++) {
                if(!noteStrings[n%12].includes('#')) {
                    let y = getSongY(n); sCtx.beginPath(); sCtx.moveTo(0,y); sCtx.lineTo(sCanvas.width,y); sCtx.stroke();
                }
            }

            sCtx.strokeStyle = "rgba(255, 255, 255, 0.4)"; sCtx.lineWidth = 2;
            sCtx.beginPath(); sCtx.moveTo(PLAYHEAD_X, 0); sCtx.lineTo(PLAYHEAD_X, sCanvas.height); sCtx.stroke();
            sCtx.fillStyle = "var(--secondary)";
            sCtx.beginPath(); sCtx.moveTo(PLAYHEAD_X, sCanvas.height); sCtx.lineTo(PLAYHEAD_X-10, sCanvas.height-15); sCtx.lineTo(PLAYHEAD_X+10, sCanvas.height-15); sCtx.fill();

            analyser.getFloatTimeDomainData(buf);
            let pitch = autoCorrelate(buf, audioContext.sampleRate);
            let userNoteFloat = null;
            if (pitch !== -1 && pitch > 80) {
                userNoteFloat = noteFromPitch(pitch);
                let targetNoteApprox = parsedSong.find(n => (n.startX - songOffset) <= PLAYHEAD_X && (n.endX - songOffset) >= PLAYHEAD_X)?.note;
                if (targetNoteApprox) {
                    if (userNoteFloat < targetNoteApprox - 6) userNoteFloat += 12;
                    if (userNoteFloat > targetNoteApprox + 6) userNoteFloat -= 12;
                }
            }

            songOffset += 3; 
            let isHittingAnything = false, activeNotes = 0;

            for (let i = 0; i < parsedSong.length; i++) {
                let note = parsedSong[i], screenStartX = note.startX - songOffset, screenEndX = note.endX - songOffset, y = getSongY(note.note);
                if (screenEndX > 0 && screenStartX < sCanvas.width) {
                    activeNotes++;
                    let isCurrentBlock = (PLAYHEAD_X >= screenStartX && PLAYHEAD_X <= screenEndX), isPitchMatching = false;
                    if (isCurrentBlock && userNoteFloat !== null && Math.abs(userNoteFloat - note.note) < 1.5) {
                        isPitchMatching = true; isHittingAnything = true; songScore += 10;
                        document.getElementById('songScoreDisplay').innerText = songScore;
                    }

                    if (screenEndX < PLAYHEAD_X) sCtx.fillStyle = "rgba(255, 255, 255, 0.1)"; 
                    else if (isCurrentBlock) {
                        sCtx.fillStyle = isPitchMatching ? "var(--accent)" : "rgba(233, 69, 96, 0.6)"; 
                        if(isPitchMatching) { sCtx.strokeStyle = "white"; sCtx.lineWidth = 3; sCtx.strokeRect(screenStartX, y - 18, screenEndX - screenStartX, 36); }
                    } else sCtx.fillStyle = "rgba(78, 205, 196, 0.4)"; 

                    sCtx.beginPath(); sCtx.roundRect(screenStartX, y - 15, screenEndX - screenStartX, 30, 8); sCtx.fill();
                    sCtx.fillStyle = "white"; sCtx.font = "bold 16px sans-serif"; sCtx.textAlign = "left"; sCtx.textBaseline = "middle";
                    sCtx.fillText(note.word, screenStartX + 10, y);
                }
            }

            if (userNoteFloat !== null) {
                let userY = getSongY(userNoteFloat);
                sCtx.beginPath(); sCtx.arc(PLAYHEAD_X, userY, isHittingAnything ? 12 : 8, 0, Math.PI*2);
                sCtx.fillStyle = isHittingAnything ? "white" : "var(--primary)";
                sCtx.shadowColor = isHittingAnything ? "var(--accent)" : "var(--primary)"; sCtx.shadowBlur = 15; sCtx.fill(); sCtx.shadowBlur = 0; 
            }

            if (activeNotes === 0 && songOffset > 500) {
                isSongPlaying = false;
                sCtx.fillStyle = "rgba(0,0,0,0.7)"; sCtx.fillRect(0,0,sCanvas.width,sCanvas.height);
                sCtx.fillStyle = "var(--accent)"; sCtx.font = "bold 30px sans-serif"; sCtx.textAlign="center";
                sCtx.fillText("挑战结束! 最终得分: " + songScore, sCanvas.width/2, sCanvas.height/2);
            } else animationId = requestAnimationFrame(loopSong);
        }

        // ================= 模块 3：声控跑酷游戏 =================
        const gCanvas = document.getElementById('gameCanvas');
        const gCtx = gCanvas.getContext('2d');
        let gameRunning = false, gameScore = 0, frames = 0, player = { x: 80, y: 150, radius: 12 }, obstacles = [];

        function drawGameInit() {
            gCtx.clearRect(0,0,gCanvas.width,gCanvas.height);
            gCtx.fillStyle = "rgba(255,255,255,0.1)"; gCtx.font = "20px sans-serif"; gCtx.textAlign="center";
            gCtx.fillText("点击上方【开始飞行】启动引擎", gCanvas.width/2, gCanvas.height/2);
        }

        function startGame() {
            if(!isMicActive) { alert("请开启麦克风！"); return; }
            if(animationId) cancelAnimationFrame(animationId);
            
            // 重置游戏状态
            player.y = gCanvas.height / 2; 
            obstacles = []; 
            gameScore = 0; 
            frames = 0; 
            gameRunning = true;
            
            document.getElementById('gameScoreDisplay').innerText = 0;
            // 隐藏结算面板
            document.getElementById('gameOverScreen').style.display = 'none'; 
            
            loopGame();
        }

        function loopGame() {
            if (currentTab !== 'game') return;
            if (!gameRunning) return;

            analyser.getFloatTimeDomainData(buf);
            let pitch = autoCorrelate(buf, audioContext.sampleRate);
            
            // 绝对悬停逻辑：安静时 targetY 维持在当前位置不动
            let targetY = player.y; 
            if (pitch !== -1 && pitch > 80) {
                let normalized = (pitch - 80) / 500;
                normalized = Math.max(0, Math.min(1, normalized)); 
                targetY = gCanvas.height - (normalized * gCanvas.height);
            } 
            
            player.y += (targetY - player.y) * 0.2; 
            player.y = Math.max(player.radius, Math.min(gCanvas.height - player.radius, player.y));

            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            
            // 绘制玩家光球 (加了酷炫的发光)
            gCtx.shadowBlur = 15; gCtx.shadowColor = "var(--secondary)";
            gCtx.fillStyle = "var(--white)"; gCtx.beginPath(); gCtx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); gCtx.fill();
            gCtx.shadowBlur = 0;

            if (frames % 80 === 0) { 
                let gapY = Math.random() * (gCanvas.height - 120) + 20;
                obstacles.push({ x: gCanvas.width, y: 0, w: 30, h: gapY }); 
                obstacles.push({ x: gCanvas.width, y: gapY + 90, w: 30, h: gCanvas.height - gapY - 90 }); 
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i]; obs.x -= 4; 
                
                // 绘制障碍物 (增加霓虹边框)
                gCtx.fillStyle = "rgba(255, 107, 107, 0.8)"; 
                gCtx.fillRect(obs.x, obs.y, obs.w, obs.h);
                gCtx.strokeStyle = "var(--primary)"; gCtx.lineWidth = 2;
                gCtx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                
                // 精准的 圆形-矩形 碰撞检测
                let testX = Math.max(obs.x, Math.min(player.x, obs.x + obs.w));
                let testY = Math.max(obs.y, Math.min(player.y, obs.y + obs.h));
                if (Math.sqrt((player.x - testX)**2 + (player.y - testY)**2) <= player.radius - 2) {
                    gameRunning = false;
                }
            }
            
            obstacles = obstacles.filter(o => o.x + o.w > 0);
            frames++; if (frames % 10 === 0) { gameScore++; document.getElementById('gameScoreDisplay').innerText = gameScore; }

            if (gameRunning) {
                animationId = requestAnimationFrame(loopGame);
            } else { 
                // 游戏结束：停止循环，呼出 UI 面板
                document.getElementById('finalScore').innerText = gameScore;
                document.getElementById('gameOverScreen').style.display = 'block';
            }
        }
    </script>
</body>
</html>
